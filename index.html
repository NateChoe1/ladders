<!DOCTYPE html>
<html>
  <body>
    <div id="playarea">
      <canvas id="goban" width=620 height=620></canvas>
      <canvas id="scratchpad" width=620 height=620></canvas>
    </div>
    <input type=color id=pen value="#0000ff">
    <input type=checkbox id=drawtoggle>
    <label for=drawtoggle>Draw</label><br>
    <button id="cleardraw">Clear drawing</button>
    <p>Shift+click on a stone in atari to automatically run out the ladder.</p>
    <p>Try <a
      href=?H4sIAPsRcWoAA+2Tuw3AIAxE+0yRCRAFe7i9/SfJB4gOEzBFElHE1YEenD8Q/Br84gbjOxAYBEWetp4ahC63BlPrhPQ9mFoH0gqsTjesW1nVoMUIOMeMcxmICwIPGROQvQyQZutzj25xSoPBZp6XlznC7GWC2WtkMmV7OrPWYMLt19OPHyxDfZs2qD7ilMW8D26LxNjabgYAAA==>
      Crasmaru and Tromp's ladder problem</a>. (from <a
      href=http://tromp.github.io/lad.pdf>this paper</a>)</p>
    <p>Try <a href=?H4sIAH1x1GoAA32PwQ0AIQgE/1RxFZj4tIr9bhfX/+9AMRK5QCLRYaJuH08f0nLVjIlBGW6P4O2phMyQGMMr0s49a/j+MFR/RuibEVaMTAWSW3SmKagLlecG3TZm+3mY3WayojpboeUDTn220IIBAAA=>Crasmaru's
      simple "Robson Reduction Tsumego"</a>. (from <a
      href=https://senseis.xmp.net/?RobsonsProofThatGOIsEXPTimeHard>Sensei's
      Library</a>)</p>
    <p>Try <a
      href=?H4sIAFBw1GoAA8WUuxnDIAyEe0+RCWjceItrb/9JgoAgCYFx0oTC1od+Dj2A83qd15EejQEDEvOP2cjmEiMFhRhirrCiSFTde4yJYS5iEh32WJqITbHJ8JhWATcp1CLUFO4KAnShbUEQE51gJDjkSnwwFfB1K/sbjOpSrda3jIE7jAZTn9u0lKZvCqvDupJ9mUnB0Oh/HUfRdOkPfZIAefi42A85XXy+vFzY3x+k2Egzp9jkzOpcxzDFMGJPY/snFvs5xShvUUh7xNCuHjaYXJhwaH5SazpsmgtM3MVfvrBdDk9Nw8an5g2ItKRL0AUAAA==>Crasmaru's
      complex "Robson Reduction Tsumego"</a>. (from <a href=https://senseis.xmp.net/?Crasmarum>Sensei's Library</a>)</p>
  </body>

  <style>
    #playarea {
      position: relative;
      width: 620px;
      height: 620px;
    }

    canvas {
      position: absolute;
    }
  </style>

  <script>
    const canvas = document.getElementById("goban");
    const ctx = canvas.getContext("2d");

    const scratchpad = document.getElementById("scratchpad");
    const drawctx = scratchpad.getContext("2d");

    const drawswitch = document.getElementById("drawtoggle");
    const pencolor = document.getElementById("pen");

    var height, width;

    var sequence = [];
    var board;
    var moveNum;

    const EMPTY = 0;
    const BLACK = 1;
    const WHITE = 2;
    const margin = 10;

    var hoverRow = -1;
    var hoverCol = -1;
    var sente = BLACK;

    function getUnitLength(canvasWidth, canvasHeight) {
      return Math.min(canvasWidth/width, canvasHeight/height);
    }

    function setHover(mouseX, mouseY) {
      const canvasWidth = canvas.width - margin*2;
      const canvasHeight = canvas.height - margin*2;
      mouseX -= margin;
      mouseY -= margin;

      if (mouseX < 0 || mouseY < 0 ||
          mouseX >= canvasWidth || mouseY >= canvasWidth) {
        hoverRow = hoverCol = -1;
      } else {
        const unitLength = getUnitLength(canvasWidth, canvasHeight);
        hoverRow = Math.floor(mouseY / unitLength);
        hoverCol = Math.floor(mouseX / unitLength);
      }
    }

    function outOfBounds(row, col) {
      return row < 0 || col < 0 || row >= height || col >= width;
    }

    function getNeighbors(row, col, color, visited) {
      if (outOfBounds(row, col)) {
        return [];
      }

      if (color === undefined) {
        var initialVisited = [];
        for (var i = 0; i < height; ++i) {
          const vRow = [];
          for (var j = 0; j < width; ++j) {
            vRow.push(false);
          }
          initialVisited.push(vRow);
        }
        return getNeighbors(row, col, board[row][col], initialVisited);
      }

      if (visited[row][col]) {
        return [];
      }
      visited[row][col] = true;

      if (board[row][col] !== color) {
        return [[row, col]];
      }

      var ret = [];
      ret = ret.concat(getNeighbors(row+1, col, color, visited));
      ret = ret.concat(getNeighbors(row-1, col, color, visited));
      ret = ret.concat(getNeighbors(row, col+1, color, visited));
      ret = ret.concat(getNeighbors(row, col-1, color, visited));
      return ret;
    }

    function getLiberties(row, col) {
      if (outOfBounds(row, col)) {
        return;
      }

      return getNeighbors(row, col).filter(
        (e) => { return board[e[0]][e[1]] === EMPTY });
    }

    function cleanOff(row, col, color) {
      if (outOfBounds(row, col)) {
        return;
      }

      if (board[row][col] !== color) {
        return;
      }

      board[row][col] = EMPTY;
      cleanOff(row+1, col, color);
      cleanOff(row-1, col, color);
      cleanOff(row, col+1, color);
      cleanOff(row, col-1, color);
    }

    function capture(row, col, color) {
      if (outOfBounds(row, col)) {
        return;
      }

      if (board[row][col] !== color) {
        return;
      }

      if (getLiberties(row, col).length !== 0) {
        return;
      }

      cleanOff(row, col, color);
    }

    function cloneBoard() {
      var newBoard = [];
      for (var i = 0; i < height; ++i) {
        var row = [];
        for (var j = 0; j < width; ++j) {
          row.push(board[i][j]);
        }
        newBoard.push(row);
      }
      return newBoard;
    }

    /* returns true for legal moves */
    function placeStone(row, col, color) {
      if (row < 0 || row >= height || col < 0 || col >= height ||
          board[row][col] !== EMPTY) {
        return false;
      }

      board[row][col] = color;
      const opp = (BLACK+WHITE) - sente;
      capture(row+1, col, opp);
      capture(row-1, col, opp);
      capture(row, col+1, opp);
      capture(row, col-1, opp);

      /* self capture. i could make this an illegal move, but having it
        actually work makes things slightly simpler */
      if (getLiberties(row, col).length === 0) {
        capture(row, col, color);
      }
      return true;
    }

    function playStone(row, col) {
      board = cloneBoard();
      if (placeStone(row, col, sente)) {
        ++moveNum;
        sequence = sequence.slice(0, moveNum);
        sequence.push(board);
        sente = (BLACK+WHITE) - sente;
      }
    }

    function skip(offset) {
      moveNum += offset;
      if (moveNum < 0) {
        moveNum = 0;
      }
      if (moveNum >= sequence.length) {
        moveNum = sequence.length-1;
      }
      board = sequence[moveNum];
      sente = moveNum % 2 + 1;
    }

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function draw() {
      var canvasWidth = canvas.width;
      var canvasHeight = canvas.height;

      /* draw background color */
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = "#dcb35c";
      ctx.fillRect(0, 0, canvasWidth, canvasHeight);

      /* insert margin through translation */
      canvasWidth -= margin*2;
      canvasHeight -= margin*2;
      ctx.translate(margin, margin);

      const unitLength = getUnitLength(canvasWidth, canvasHeight);

      /* draw grid */
      ctx.beginPath();
      for (var i = 0; i < width; ++i) {
        var x = (unitLength*i) + (unitLength/2);
        ctx.moveTo(x, unitLength/2);
        ctx.lineTo(x, unitLength*height - unitLength/2);
      }
      for (var i = 0; i < height; ++i) {
        var y = (unitLength*i) + (unitLength/2);
        ctx.moveTo(unitLength/2, y);
        ctx.lineTo(unitLength*width - unitLength/2, y);
      }
      ctx.stroke();

      for (var i = 0; i < height; ++i) {
        for (var j = 0; j < width; ++j) {
          var color = board[i][j];
          if (color === EMPTY) {
            if (i == hoverRow && j == hoverCol) {
              ctx.globalAlpha = 0.5;
              color = sente;
            } else {
              continue;
            }
          }
          if (color === BLACK) {
            ctx.fillStyle = "#000";
          } else {
            ctx.fillStyle = "#fff";
          }
          ctx.beginPath();
          ctx.arc(unitLength*j + unitLength/2, unitLength*i + unitLength/2,
            unitLength/2, 0, Math.PI*2);
          ctx.fill();
          ctx.globalAlpha = 1;
        }
      }
    }

    async function runLadder(row, col) {
      if (outOfBounds(row, col)) {
        return;
      }
      if (board[row][col] === EMPTY) {
        return;
      }

      const defender = sente;
      const attacker = (BLACK+WHITE) - sente;

      for (;;) {
        /* defender turn. this is a somewhat inefficient algorithm, taking
           O(n^4) time in the worst case when O(n^2) is clearly sufficient, but
           for most real ladders the difference is too small to notice. */
        const neighbors = getNeighbors(row, col);
        var candidates = [];
        for (const neighbor of neighbors) {
          if (board[neighbor[0]][neighbor[1]] === EMPTY) {
            /* extend by playing on a liberty */
            candidates.push(neighbor);
          } else {
            /* extend by capturing an opponent stone */
            const enemyLiberties = getLiberties(...neighbor);
            if (enemyLiberties.length === 1) {
              candidates.push(enemyLiberties[0]);
            }
          }
        }
        var oldBoard = board;
        var bestMove = undefined;
        var okayMoves = [];
        for (const candidate of candidates) {
          board = cloneBoard(oldBoard);
          placeStone(...candidate, defender);

          /* this move is self capture */
          if (board[row][col] !== defender) {
            continue;
          }

          const newLiberties = getLiberties(row, col).length;

          if (newLiberties > 2) {
            /* we've escaped the ladder */
            bestMove = candidate;
            break;
          } else if (newLiberties == 2) {
            /* we continue the ladder */
            okayMoves.push(candidate);
          }
        }
        board = oldBoard;

        /* we've escaped the ladder */
        if (bestMove !== undefined) {
          playStone(...bestMove);
          break;
        }

        /* maybe there's no good move to escape, or maybe there are multiple
           options */
        if (okayMoves.length !== 1) {
          break;
        }

        playStone(...okayMoves[0]);
        draw();
        await sleep(20);

        /* attacker turn */
        /* at this point the defender has two liberties, and we must play atari.
           we assume that both liberties are miai. if the miai response to an
           atari allows the defender to get 3 liberties, we rule it out.
           otherwise, we keep it as a candidate. */
        const miai = getLiberties(row, col);

        /* sanity check */
        if (miai.length !== 2) {
          break;
        }

        oldBoard = board;
        candidates = [];
        for (var i = 0; i < 2; ++i) {
          board = oldBoard;
          board = cloneBoard();
          placeStone(...miai[i], attacker);

          /* the first move should be an atari. if one of the liberties is
             surrounded by a ponnuki then the attempted surrounding move could
             be self capture instead. */
          if (board[row][col] !== defender ||
              getLiberties(row, col).length !== 1) {
            continue;
          }

          placeStone(...miai[1-i], defender);
          if (board[row][col] === defender &&
              getLiberties(row, col).length > 2) {
            continue;
          }
          candidates.push(miai[i]);
        }
        board = oldBoard;

        if (candidates.length === 1) {
          playStone(...candidates[0]);
          draw();
          await sleep(20);
        } else {
          break;
        }
      }
    }

    function mouseout() {
      hoverRow = hoverCol = -1;
      draw();
    }

    function mousemove(ev) {
      if (drawswitch.checked) {
        hoverRow = hoverCol = -1;
        if (ev.buttons === 0) {
          return;
        }
        const endX = ev.offsetX;
        const endY = ev.offsetY;
        const startX = endX - ev.movementX;
        const startY = endY - ev.movementY;
        drawctx.strokeStyle = pencolor.value;
        drawctx.lineWidth = 3;
        drawctx.beginPath();
        drawctx.moveTo(startX, startY);
        drawctx.lineTo(endX, endY);
        drawctx.stroke();
      } else {
        setHover(ev.offsetX, ev.offsetY);
        draw();
      }
    }

    function mouseup(ev) {
      if (!drawswitch.checked) {
        setHover(ev.offsetX, ev.offsetY);
        if (!ev.shiftKey) {
          playStone(hoverRow, hoverCol);
        } else {
          runLadder(hoverRow, hoverCol);
        }
        draw();
      }
    }

    async function main() {
      var stateRaw;

      canvas.addEventListener("mouseout", mouseout);
      scratchpad.addEventListener("mouseout", mouseout);

      canvas.addEventListener("mousemove", mousemove);
      scratchpad.addEventListener("mousemove", mousemove);

      canvas.addEventListener("mouseup", mouseup);
      scratchpad.addEventListener("mouseup", mouseup);

      document.getElementById("cleardraw").addEventListener("click", () => {
        drawctx.clearRect(0, 0, scratchpad.width, scratchpad.height);
      });

      window.addEventListener("keydown", (ev) => {
        if (ev.keyCode == 37) { /* left arrow */
          skip(-1);
        } else if (ev.keyCode == 39) { /* right arrow */
          skip(1);
        } else if (ev.keyCode == 33) { /* page up */
          skip(-10);
        } else if (ev.keyCode == 34) { /* page down */
          skip(10);
        }
        draw();
      }, true);

      /* empty board */
      if (window.location.search === "") {
        stateRaw = "19 19" + ("\n" + ".".repeat(19)).repeat(19);
      } else {
        const state64 = window.location.search.substring(1);
        const compressed = Uint8Array.fromBase64(state64);

        const stream = new DecompressionStream("gzip");
        const writer = stream.writable.getWriter();
        writer.write(compressed);
        writer.close();

        const reader = stream.readable.getReader();
        var output = []
        for (;;) {
          const result = await reader.read();

          if (result.value) {
            output.push(...result.value);
          }

          if (result.done) {
            break;
          }
        }

        stateRaw = new TextDecoder().decode(new Uint8Array(output));
      }

      const lines = stateRaw.split("\n");
      const dims = lines[0].split(" ");
      height = Number(dims[0]);
      width = Number(dims[1]);

      board = [];
      for (var i = 0; i < height; ++i) {
        const rowData = lines[i+1];
        const row = []
        for (var j = 0; j < width; ++j) {
          if (rowData[j] === 'X') {
            row.push(BLACK);
          } else if (rowData[j] === "O") {
            row.push(WHITE);
          } else {
            row.push(EMPTY);
          }
        }
        board.push(row);
      }

      sequence.push(board);
      moveNum = 0;

      draw();
    }

    main();
  </script>
</html>
